<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>浙江寻宝记云上展 - 拼图游戏</title>
<style>
:root{
  --gold:#ffd200;
  --orange:#f7971e;
  --bg-deep:#0a0a1a;
  --bg-card:rgba(22,33,62,.85);
  --glass:rgba(22,33,62,.7);
  --glow:0 0 20px rgba(255,215,0,.25);
  --curve-smooth:cubic-bezier(.4,0,.2,1);
  --curve-bounce:cubic-bezier(.34,1.56,.64,1);
  --z-star:1;
  --z-screen:10;
  --z-modal:200;
  --z-food:300;
  --z-confetti:400;
  --z-splash:500;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-deep);color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none;}

/* ===== Keyframes ===== */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes slideOutLeft{from{transform:translateX(0);opacity:1;}to{transform:translateX(-100%);opacity:0;}}
@keyframes scaleIn{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes twinkle{0%,100%{opacity:.3;}50%{opacity:1;}}
@keyframes piecePlace{0%{transform:scale(.8);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(255,215,0,.2);}50%{box-shadow:0 0 30px rgba(255,215,0,.5);}}

/* ===== Screen base ===== */
.screen{position:fixed;inset:0;z-index:var(--z-screen);}
.screen.hidden{display:none;}

/* ===== Star Field ===== */
#starField{position:fixed;inset:0;pointer-events:none;z-index:var(--z-star);overflow:hidden;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite;opacity:.3;}

/* ===== Splash Screen ===== */
#splashScreen{position:fixed;inset:0;z-index:var(--z-splash);display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1a1040,#0a0a1a);overflow:hidden;cursor:pointer;touch-action:manipulation;}
.splash-bg{position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(247,151,30,.08),transparent 50%),radial-gradient(circle at 80% 50%,rgba(255,210,0,.06),transparent 50%);}
#splashScreen .splash-content{position:relative;z-index:2;text-align:center;padding:40px;}
#splashScreen .splash-title{font-size:clamp(36px,9vw,72px);font-weight:800;background:linear-gradient(135deg,var(--orange),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0;transform:scale(.8);animation:scaleIn 1s var(--curve-bounce) forwards;letter-spacing:4px;}
#splashScreen .splash-subtitle{font-size:clamp(14px,3.5vw,22px);color:rgba(255,255,255,.7);margin-top:12px;letter-spacing:6px;opacity:0;animation:fadeIn 1s ease .5s forwards;}
#splashScreen .splash-prompt{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);font-size:14px;color:var(--gold);letter-spacing:2px;opacity:0;animation:fadeIn 1s ease 2.5s forwards;}@keyframes splashPulse{0%,100%{opacity:1;}50%{opacity:.3;}}
#splashScreen .splash-prompt::after{display:block;text-align:center;margin-top:4px;content:'✦';font-size:10px;animation:splashPulse 2s ease-in-out infinite;}
#splashScreen.fadeOut{opacity:0;transition:opacity .6s ease;}

/* ===== Select Screen ===== */
#selectScreen{z-index:var(--z-screen);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 0 40px;}
#selectScreen .select-header{padding:40px 20px 24px;text-align:center;position:relative;}
#selectScreen .select-header::after{content:'';display:block;width:60px;height:3px;margin:12px auto 0;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;}
#selectScreen .select-title{font-size:clamp(22px,5vw,32px);font-weight:800;background:linear-gradient(135deg,var(--orange),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
#selectScreen .select-subtitle{font-size:14px;color:rgba(255,255,255,.45);letter-spacing:4px;}
.city-grid{display:flex;gap:14px;padding:8px 16px 24px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.city-grid::-webkit-scrollbar{display:none;}
.city-card{position:relative;min-width:73vw;border-radius:16px;overflow:hidden;background:var(--glass);box-shadow:0 8px 32px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s,box-shadow .15s;aspect-ratio:4/3;flex-shrink:0;scroll-snap-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);}
.city-card:active{transform:scale(.96);box-shadow:0 4px 16px rgba(0,0,0,.5);}
.city-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.city-card .label{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:18px;font-weight:700;text-align:left;pointer-events:none;}
.city-card .label .city-name{font-size:20px;font-weight:700;color:#fff;}
.city-card .label .city-food{font-size:13px;font-weight:400;color:var(--gold);margin-top:2px;opacity:.9;}
.city-card .label .city-tagline{font-size:12px;font-weight:300;color:rgba(255,255,255,.5);margin-top:2px;}
.city-card .food-badge{position:absolute;top:12px;left:12px;background:rgba(255,210,0,.9);color:#1a1a2e;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;pointer-events:none;box-shadow:0 2px 8px rgba(255,210,0,.3);}
@media(min-width:768px){
  .city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:8px 20px 40px;max-width:800px;margin:0 auto;overflow:visible;}
  .city-card{min-width:0;}
}

/* ===== Puzzle Screen ===== */
#puzzleScreen{z-index:var(--z-screen);display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 120%,rgba(247,151,30,.06),transparent 60%),var(--bg-deep);}
.puzzle-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.puzzle-header .btn-back{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:background .2s;}
.puzzle-header .btn-back:active{background:rgba(255,255,255,.1);}
.puzzle-header .timer{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,.3);}
.puzzle-header .btn-ref{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:8px;transition:background .2s;}
.puzzle-header .btn-ref:active{background:rgba(255,255,255,.1);}
.puzzle-header .city-label{font-size:14px;font-weight:600;color:rgba(255,255,255,.8);text-align:center;}

/* Reference image */
#refOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:var(--z-modal);justify-content:center;align-items:center;}
#refOverlay.show{display:flex;}
#refOverlay img{max-width:90vw;max-height:80vh;border-radius:8px;box-shadow:0 0 30px rgba(0,0,0,.5);}
#refOverlay .close-ref{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;width:44px;height:44px;border-radius:50%;cursor:pointer;}

/* Puzzle area */
.puzzle-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:hidden;}
.puzzle-grid{position:relative;width:min(85vw,85vh - 200px);aspect-ratio:4/3;background:#0f0f23;border-radius:12px;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 40px rgba(255,215,0,.08);will-change:transform;}
.grid-slot{position:absolute;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);border-radius:3px;transition:background .3s;display:flex;align-items:center;justify-content:center;font-size:24px;color:rgba(255,255,255,.15);}
.grid-slot.filled{border-color:transparent;background:transparent;animation:piecePlace .3s var(--curve-bounce);}
.grid-slot.flash{box-shadow:inset 0 0 20px rgba(255,215,0,.6);transition:box-shadow .1s;}
.grid-slot.highlight{background:rgba(255,215,0,.15);border-color:#ffd200;}
.grid-slot.correct{background:rgba(0,255,100,.12);border-color:rgba(0,255,100,.5)!important;}
.grid-slot.wrong{background:rgba(255,50,50,.12);border-color:rgba(255,50,50,.5)!important;}

/* Tray */
.tray{flex-shrink:0;padding:10px 12px;background:#16213e;border-top:1px solid rgba(255,255,255,.1);}
.tray-label{font-size:12px;color:#888;margin-bottom:8px;text-align:center;}
.tray-pieces{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:60px;}
.tray-piece{width:56px;height:56px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .2s;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0;}
.tray-piece:active{transform:scale(.9);}
.tray-piece.selected{border-color:#ffd200;transform:scale(1.1);}
.tray-piece img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;}
.tray-empty{color:#555;font-size:13px;padding:16px;text-align:center;}

/* Win modal */
#winModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:var(--z-modal);justify-content:center;align-items:center;}
#winModal.show{display:flex;}
#winModal.show .win-box{animation:scaleIn .5s var(--curve-bounce);}
.win-box{background:linear-gradient(135deg,#16213e,#1a1a3e);border-radius:20px;padding:40px 32px;text-align:center;max-width:340px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,215,0,.3);}
.win-box h2{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.win-box .trophy{font-size:64px;margin-bottom:8px;}
.win-box .final-time{font-size:32px;font-weight:700;color:#ffd200;margin:12px 0 20px;}
.win-box .btn-group{display:flex;flex-direction:column;gap:10px;}
.win-box .btn-group button{padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s;}
.win-box .btn-group button:active{transform:scale(.97);}
.win-box .btn-replay{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;}
.win-box .btn-menu{background:rgba(255,255,255,.1);color:#fff;}

/* Confetti */
.confetti{position:fixed;width:10px;height:10px;top:-10px;z-index:var(--z-confetti);animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);}}
.confetti-star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--gold)!important;}

/* Food info overlay */
#foodOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:var(--z-food);justify-content:center;align-items:flex-end;padding-bottom:8vh;}
#foodOverlay.show{display:flex;}
#foodOverlay.show .food-box{animation:slideUp .5s var(--curve-bounce);}
.food-box{background:linear-gradient(135deg,#1a1a3e,#2a1a3e);border-radius:20px 20px 0 0;padding:32px 24px 24px;max-width:400px;width:100%;box-shadow:0 -10px 40px rgba(0,0,0,.5);border:1px solid rgba(255,215,0,.15);border-bottom:none;text-align:center;}
.food-box .unlock-msg{font-size:16px;color:#ffd200;font-weight:600;margin-bottom:16px;line-height:1.6;}
.food-box .food-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:12px;}
.food-box .food-list{text-align:left;font-size:14px;color:#ccc;line-height:1.8;margin-bottom:16px;padding:0 4px;}
.food-box .food-list span.label{color:#ffd200;font-weight:600;}
.food-box .food-cert{width:80px;height:auto;border-radius:8px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.4);border:2px solid rgba(255,215,0,.3);cursor:pointer;transition:transform .2s;}
.food-box .food-cert:active{transform:scale(.95);}
.food-box .btn-food-close{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);color:#ffd200;padding:10px 28px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;}
.food-box .btn-food-close:active{background:rgba(255,215,0,.3);}

/* Image preview overlay */
#imgPreview{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:var(--z-modal);justify-content:center;align-items:center;flex-direction:column;gap:16px;}
#imgPreview.show{display:flex;}
#imgPreview img{max-width:92vw;max-height:78vh;width:auto;height:auto;border-radius:8px;box-shadow:0 0 30px rgba(0,0,0,.5);object-fit:contain;display:block;}
#imgPreview .preview-actions{display:flex;gap:12px;}
#imgPreview .preview-actions button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;}
#imgPreview .preview-actions button:active{background:rgba(255,255,255,.3);}
/* Responsive */
@media(min-width:768px){
  .puzzle-grid{width:min(50vw,500px);}
  .tray-piece{width:72px;height:72px;}
}
</style>
</head>
<body>

<!-- ===== Star Field ===== -->
<div id="starField"></div>

<!-- ===== Splash Screen ===== -->
<div id="splashScreen">
  <div class="splash-bg"></div>
  <div class="splash-content">
    <div class="splash-title">浙江寻宝记</div>
    <div class="splash-subtitle">十一城风味拼图之旅</div>
    <div class="splash-prompt">轻触屏幕 · 开启旅程</div>
  </div>
</div>

<div id="selectScreen" class="screen hidden">
  <div class="select-header">
    <div class="select-title">浙江寻宝记</div>
    <div class="select-subtitle">十一城 · 一味一江南</div>
  </div>
  <div class="city-grid" id="cityGrid"></div>
</div>

<div id="puzzleScreen" class="screen hidden">
  <div class="puzzle-header">
    <button class="btn-back" id="btnBack">← 返回</button>
    <div class="city-label" id="cityLabel"></div>
    <span class="timer" id="timer">00:00</span>
    <button class="btn-ref" id="btnRef">👁 参考</button>
  </div>
  <div class="puzzle-body">
    <div class="puzzle-grid" id="puzzleGrid"></div>
  </div>
  <div class="tray">
    <div class="tray-label">正确: <span id="correctCount">0/12</span> &nbsp;•&nbsp; 👆 点击碎片，再点击格子放置</div>
    <div class="tray-pieces" id="tray"></div>
  </div>
</div>

<!-- Reference overlay -->
<div id="refOverlay">
  <button class="close-ref" id="closeRef">✕</button>
  <img id="refImg" alt="reference">
</div>

<!-- Win modal -->
<div id="winModal">
  <div class="win-box">
    <div class="trophy">🎉</div>
    <h2>拼图完成！</h2>
    <div class="final-time" id="finalTime">00:00</div>
    <div class="btn-group">
      <button class="btn-replay" id="btnReplay">🔄 再玩一次</button>
      <button class="btn-menu" id="btnMenu">🏠 返回选城市</button>
    </div>
  </div>
</div>

<!-- Food info overlay -->
<div id="foodOverlay">
  <div class="food-box" id="foodBox">
    <div style="position:relative;display:inline-block">
      <img src="images/thumbs_cert.jpg" class="food-cert" alt="奖状" id="foodCert" onclick="previewCert()">
      <div onclick="previewCert()" style="position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.7);color:#ffd200;font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid rgba(255,215,0,.3);pointer-events:none">🔍 放大</div>
    </div>
    <div class="unlock-msg" id="unlockMsg"></div>
    <div class="food-title" id="foodTitle"></div>
    <div class="food-list" id="foodList"></div>
    <button class="btn-food-close" id="btnFoodClose">知道了</button>
  </div>
</div>

<!-- Image preview overlay -->
<div id="imgPreview" onclick="if(event.target===this)closePreview()">
  <img id="previewImg" alt="奖状">
  <div class="preview-actions">
    <button onclick="downloadCert()">⬇ 下载</button>
    <button onclick="closePreview()">✕ 关闭</button>
  </div>
</div>

<script>
// ===== Config =====
const ROWS = 3;
const COLS = 4;
const TOTAL = 12;
const IMAGES = [
  { file: 'VCG211178240184.jpg', name: '杭州' },
  { file: 'VCG211560176644.jpg', name: '温州' },
  { file: 'VCG211343690953.jpg', name: '衢州' },
  { file: 'VCG211532739246.jpg', name: '宁波' },
  { file: 'VCG211585482521.jpg', name: '湖州' },
  { file: 'VCG211480698764.jpg', name: '嘉兴' },
  { file: 'VCG211441857941.jpg', name: '绍兴' },
  { file: 'VCG211438121898.jpg', name: '丽水' },
  { file: 'VCG211343940394.jpg', name: '金华' },
  { file: 'VCG211486589091.jpg', name: '舟山' },
  { file: 'VCG211337212104.jpg', name: '台州' },
];
const CITY_META = {
  '杭州': { dish:'东坡肉', tagline:'人间天堂·宋韵食光' },
  '宁波': { dish:'宁波汤圆', tagline:'书藏古今·港通天下一' },
  '温州': { dish:'温州鱼丸', tagline:'东南山水·瓯越风华' },
  '嘉兴': { dish:'嘉兴肉粽', tagline:'鱼米之乡·江南风物' },
  '湖州': { dish:'太湖三白', tagline:'丝绸之府·鱼米之乡' },
  '绍兴': { dish:'绍兴臭豆腐', tagline:'名士之乡·老酒滋味' },
  '金华': { dish:'金华火腿', tagline:'百工之乡·味道千年' },
  '衢州': { dish:'三头一掌', tagline:'南孔圣地·浙西风味' },
  '舟山': { dish:'海鲜面', tagline:'海天佛国·渔港风情' },
  '台州': { dish:'海苔饼', tagline:'山海水城·和合圣地' },
  '丽水': { dish:'缙云烧饼', tagline:'秀山丽水·养生福地' },
};

// ===== City Food Data =====
const CITY_FOOD = {
  '杭州': { title: '杭州美食图鉴', lines: ['特色美食：葱包桧、片儿川', '代表品牌：知味观'] },
  '宁波': { title: '宁波美食图鉴', lines: ['特色美食：宁波汤圆、水磨年糕', '代表品牌：缸鸭狗、楼茂记'] },
  '温州': { title: '温州美食图鉴', lines: ['特色美食：温州糯米饭、温州鱼丸', '地域特色：山海风味经典市井小吃'] },
  '嘉兴': { title: '嘉兴美食图鉴', lines: ['特色美食：嘉兴肉粽、定胜糕', '代表品牌：五芳斋'] },
  '湖州': { title: '湖州美食图鉴', lines: ['特色美食：南浔羊肉面、千张包子', '代表品牌：丁莲芳'] },
  '绍兴': { title: '绍兴美食图鉴', lines: ['特色美食：绍兴臭豆腐、茴香豆', '地域特色：黄酒风味经典小吃'] },
  '金华': { title: '金华美食图鉴', lines: ['特色美食：金华火腿、梅干菜酥饼', '地域名片：金华火腿'] },
  '衢州': { title: '衢州美食图鉴', lines: ['特色美食：三头一掌、龙游发糕', '地域特色：浙西风味香辣小吃'] },
  '舟山': { title: '舟山美食图鉴', lines: ['特色美食：舟山海鲜面、即食海味', '地域特色：海岛特色海鲜零食'] },
  '台州': { title: '台州美食图鉴', lines: ['特色美食：临海海苔饼、天台饺饼筒', '地域特色：江南地道民间小吃'] },
  '丽水': { title: '丽水美食图鉴', lines: ['特色美食：缙云烧饼、遂昌长粽', '非遗美食：缙云烧饼'] },
};

// ===== State =====
let state = {
  pieces: [],        // { id, row, col, dataUrl }
  placed: {},        // 'row-col' -> piece id
  selected: null,    // piece id
  timer: 0,
  timerInterval: null,
  currentImage: null,
  isComplete: false,
  _starting: false,  // guard against double-fire on mobile
};

// ===== Init City Grid =====
function initCityGrid() {
  var grid = document.getElementById('cityGrid');
  grid.innerHTML = '';
  IMAGES.forEach(function(img, idx) {
    var meta = CITY_META[img.name] || { dish:'', tagline:'' };
    var card = document.createElement('div');
    card.className = 'city-card';
    card.style.opacity = '0';
    card.style.transform = 'translateY(30px)';
    card.innerHTML = '<div class="food-badge">' + meta.dish + '</div><img src="images/thumbs_' + img.file + '" alt="' + img.name + '" loading="lazy" decoding="async"><div class="label"><div class="city-name">' + img.name + '</div><div class="city-food">' + meta.dish + '</div><div class="city-tagline">' + meta.tagline + '</div></div>';
    card.addEventListener('click', function() { startPuzzle(idx); });
    card.addEventListener('touchend', function(e) { e.preventDefault(); startPuzzle(idx); }, {passive:false});
    grid.appendChild(card);
    // Stagger entrance animation
    setTimeout(function() {
      card.style.transition = 'opacity .5s ease, transform .5s var(--curve-bounce)';
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    }, 200 + idx * 60);
  });
}

// ===== Slice image into pieces =====
function sliceImage(img) {
  const pw = img.naturalWidth / COLS;
  const ph = img.naturalHeight / ROWS;
  const cw = 80, ch = Math.round(80 * ph / pw);
  const pieces = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, c * pw, r * ph, pw, ph, 0, 0, cw, ch);
      pieces.push({ id: `${r}-${c}`, row: r, col: c, dataUrl: canvas.toDataURL() });
    }
  }
  return pieces;
}

// ===== Shuffle =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  // ensure not identical to original
  if (a.every((p, idx) => p.id === arr[idx].id)) {
    [a[0], a[1]] = [a[1], a[0]];
  }
  return a;
}

// ===== Start Puzzle =====
function startPuzzle(imgIdx) {
  if (state._starting) return;
  state._starting = true;
  // Set city label
  var meta = CITY_META[IMAGES[imgIdx].name] || {};
  document.getElementById('cityLabel').textContent = IMAGES[imgIdx].name + (meta.dish ? ' · ' + meta.dish : '');
  // Transition to puzzle screen
  transitionTo('puzzleScreen');
  document.getElementById('timer').textContent = '加载中...';
  // Load full image (no crossOrigin — same origin)
  const img = new Image();
  img.onload = () => {
    state._starting = false;
    const allPieces = sliceImage(img);
    state.pieces = allPieces;
    state.placed = {};
    state.selected = null;
    state.isComplete = false;
    state.currentImage = imgIdx;
    state.pieceAspect = (img.naturalWidth / COLS) / (img.naturalHeight / ROWS);
    clearInterval(state.timerInterval);
    state.timer = 0;
    document.getElementById('timer').textContent = '00:00';

    document.getElementById('refImg').src = `images/${IMAGES[imgIdx].file}`;

    renderGrid();
    renderTray(shuffle(allPieces));
    state.timerInterval = setInterval(() => {
      state.timer++;
      document.getElementById('timer').textContent = formatTime(state.timer);
    }, 1000);
  };
  img.onerror = function() { state._starting = false; };
  img.src = `images/${IMAGES[imgIdx].file}`;
}

// ===== Render Grid =====
function renderGrid() {
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const slot = document.createElement('div');
      slot.className = 'grid-slot';
      slot.dataset.row = r;
      slot.dataset.col = c;
      const wp = 100 / COLS;
      const hp = 100 / ROWS;
      slot.style.width = wp + '%';
      slot.style.height = hp + '%';
      slot.style.left = (c * wp) + '%';
      slot.style.top = (r * hp) + '%';
      slot.addEventListener('click', () => onSlotClick(r, c));
      grid.appendChild(slot);
    }
  }
  updateGridFill();
}

// ===== Check if piece is in correct position =====
function isPieceCorrect(slotKey, pieceId) {
  return slotKey === pieceId;
}

// ===== Count correct placements =====
function countCorrect() {
  let n = 0;
  for (const [key, pid] of Object.entries(state.placed)) {
    if (isPieceCorrect(key, pid)) n++;
  }
  return n;
}

// ===== Update Grid Fill =====
function updateGridFill() {
  const slots = document.querySelectorAll('.grid-slot');
  slots.forEach(slot => {
    const r = parseInt(slot.dataset.row);
    const c = parseInt(slot.dataset.col);
    const key = `${r}-${c}`;
    const pid = state.placed[key];
    slot.classList.remove('correct', 'wrong');
    if (pid) {
      const piece = state.pieces.find(p => p.id === pid);
      slot.classList.add('filled');
      if (isPieceCorrect(key, pid)) {
        slot.classList.add('correct');
      } else {
        slot.classList.add('wrong');
      }
      slot.innerHTML = `<img src="${piece.dataUrl}" decoding="async" style="width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;">`;
    } else {
      slot.classList.remove('filled');
      slot.innerHTML = '';
    }
  });
  // Update counter
  const c = countCorrect();
  document.getElementById('correctCount').textContent = `${c}/${TOTAL}`;
}

// ===== Render Tray =====
function renderTray(pieces) {
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  const unplaced = pieces.filter(p => !Object.values(state.placed).includes(p.id));
  if (unplaced.length === 0) {
    tray.innerHTML = '<div class="tray-empty">✅ 全部放置完成！</div>';
    return;
  }
  const tpH = 64, tpW = Math.round(tpH * (state.pieceAspect || 1));
  unplaced.forEach(p => {
    const div = document.createElement('div');
    div.className = 'tray-piece' + (state.selected === p.id ? ' selected' : '');
    div.dataset.pieceId = p.id;
    div.style.width = tpW + 'px';
    div.style.height = tpH + 'px';
    div.innerHTML = `<img src="${p.dataUrl}" alt="piece">`;
    div.addEventListener('click', () => onTrayClick(p.id));
    tray.appendChild(div);
  });
}

// ===== Tray click =====
function onTrayClick(pieceId) {
  if (state.isComplete) return;
  if (state.selected === pieceId) {
    state.selected = null;
  } else {
    state.selected = pieceId;
  }
  updateSelection();
}

// ===== Slot click =====
function onSlotClick(row, col) {
  if (state.isComplete) return;
  const key = `${row}-${col}`;
  if (state.placed[key]) {
    // Remove placed piece back to tray
    const pid = state.placed[key];
    delete state.placed[key];
    state.selected = pid;
    updateGridFill();
    updateSelection();
    renderTray(state.pieces);
    return;
  }
  if (!state.selected) return;
  // Place piece
  state.placed[key] = state.selected;
  state.selected = null;
  updateGridFill();
  renderTray(state.pieces);
  checkWin();
}

// ===== Update Selection Highlight =====
function updateSelection() {
  document.querySelectorAll('.tray-piece').forEach(el => {
    el.classList.toggle('selected', el.dataset.pieceId === state.selected);
  });
}

// ===== Show Food Info =====
function showFoodInfo(cityName) {
  const food = CITY_FOOD[cityName];
  if (!food) return;
  document.getElementById('unlockMsg').textContent = `✨ 恭喜成功解锁${cityName}的美食记忆！`;
  document.getElementById('foodTitle').textContent = food.title;
  document.getElementById('foodList').innerHTML = food.lines.map(l => `<div>${l}</div>`).join('');
  // Delay 2s then show (after win modal appears)
  setTimeout(() => {
    document.getElementById('foodOverlay').classList.add('show');
  }, 2000);
}

// ===== Check Win =====
function checkWin() {
  if (countCorrect() === TOTAL) {
    state.isComplete = true;
    clearInterval(state.timerInterval);
    const cityName = IMAGES[state.currentImage].name;
    // Stage 1: grid flash
    flashGrid();
    // Stage 2: win modal + confetti (after flash)
    setTimeout(function() {
      document.getElementById('finalTime').textContent = formatTime(state.timer);
      document.getElementById('winModal').classList.add('show');
      spawnConfetti();
      // Stage 3: food card (after win modal)
      showFoodInfo(cityName);
    }, 800);
  }
}

// ===== Confetti =====
function spawnConfetti() {
  var isMobile = window.innerWidth < 480;
  var colors = ['#ffd200','#f7971e','#ff6b6b','#48dbfb','#ff9ff3','#54a0ff','#5f27cd'];
  var count = isMobile ? 40 : 90;
  function wave() {
    for (var i = 0; i < count; i++) {
      (function(delay) {
        setTimeout(function() {
          var el = document.createElement('div');
          var isStar = Math.random() > 0.7;
          el.className = 'confetti' + (isStar ? ' confetti-star' : '');
          el.style.left = Math.random() * 100 + 'vw';
          el.style.background = isStar ? '' : colors[Math.floor(Math.random() * colors.length)];
          el.style.width = (4 + Math.random() * 8) + 'px';
          el.style.height = (4 + Math.random() * 8) + 'px';
          el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          el.style.animationDuration = (2 + Math.random() * 3) + 's';
          el.style.animationDelay = Math.random() * 1.5 + 's';
          el.style.setProperty('--dx', (Math.random() - .5) * 200 + 'px');
          document.body.appendChild(el);
          setTimeout(function() { el.remove(); }, 5000);
        }, delay);
      })(Math.random() * 800);
    }
  }
  wave();
  // Second wave
  setTimeout(wave, 600);
}

// ===== Grid Flash (Stage 1 win) =====
function flashGrid() {
  var slots = document.querySelectorAll('.grid-slot');
  slots.forEach(function(slot, i) {
    setTimeout(function() {
      slot.classList.add('flash');
      setTimeout(function() { slot.classList.remove('flash'); }, 300);
    }, i * 50);
  });
}

// ===== Format Time =====
function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

// ===== Event Listeners =====
document.getElementById('btnBack').addEventListener('click', () => {
  clearInterval(state.timerInterval);
  transitionTo('selectScreen', 'back');
});

document.getElementById('btnReplay').addEventListener('click', () => {
  document.getElementById('winModal').classList.remove('show');
  document.getElementById('foodOverlay').classList.remove('show');
  startPuzzle(state.currentImage);
});

document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('winModal').classList.remove('show');
  document.getElementById('foodOverlay').classList.remove('show');
  transitionTo('selectScreen', 'back');
});

document.getElementById('btnRef').addEventListener('click', () => {
  document.getElementById('refOverlay').classList.add('show');
});
document.getElementById('closeRef').addEventListener('click', () => {
  document.getElementById('refOverlay').classList.remove('show');
});
document.getElementById('refOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('refOverlay').classList.remove('show');
});

document.getElementById('btnFoodClose').addEventListener('click', () => {
  document.getElementById('foodOverlay').classList.remove('show');
});
document.getElementById('foodOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('foodOverlay').classList.remove('show');
});

// ===== Image Preview (onclick helpers) =====
function previewCert() {
  var img = document.getElementById('previewImg');
  img.src = 'images/cert.jpg';
  img.onerror = function(){ img.src = 'images/cert.jpg?' + Date.now(); };
  // Clear and re-show to force reflow on mobile
  var ov = document.getElementById('imgPreview');
  ov.style.display = 'none';
  void ov.offsetHeight;
  ov.classList.add('show');
  ov.style.display = '';
}
function closePreview() {
  document.getElementById('imgPreview').classList.remove('show');
}
function downloadCert() {
  var a = document.createElement('a');
  a.href = document.getElementById('previewImg').src || 'images/cert.jpg';
  a.download = 'certificate.jpg';
  a.click();
}

// ===== Star Field =====
function createStarField() {
  var container = document.getElementById('starField');
  for (var i = 0; i < 60; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
    star.style.setProperty('--d', (2 + Math.random() * 4) + 's');
    star.style.animationDelay = Math.random() * 4 + 's';
    container.appendChild(star);
  }
}
createStarField();

// ===== Splash Screen =====
var _splashTimer = null;
var _splashDone = false;
function showSplash() {
  var el = document.getElementById('splashScreen');
  el.style.display = 'flex';
  _splashTimer = setTimeout(function() { dismissSplash(); }, 4000);
  function dismissHandler(e) {
    if (e) e.preventDefault();
    clearTimeout(_splashTimer);
    el.removeEventListener('click', dismissHandler);
    el.removeEventListener('touchend', dismissHandler);
    dismissSplash();
  }
  el.addEventListener('click', dismissHandler);
  el.addEventListener('touchend', dismissHandler, {passive:false});
}
function dismissSplash() {
  if (_splashDone) return;
  _splashDone = true;
  var el = document.getElementById('splashScreen');
  el.classList.add('fadeOut');
  setTimeout(function() {
    el.style.display = 'none';
    transitionTo('selectScreen');
  }, 600);
}

// ===== Transition System =====
function transitionTo(screenId, dir) {
  dir = dir || 'forward';
  var screens = ['selectScreen', 'puzzleScreen'];
  screens.forEach(function(id) {
    var el = document.getElementById(id);
    if (id === screenId) {
      // Show target screen with entrance animation
      el.style.display = id === 'puzzleScreen' ? 'flex' : 'block';
      el.classList.remove('hidden');
      el.style.opacity = '0';
      el.style.transform = dir === 'back' ? 'translateX(-30%)' : 'translateX(30%)';
      void el.offsetHeight;
      el.style.transition = 'transform .45s var(--curve-smooth), opacity .45s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateX(0)';
      setTimeout(function() {
        el.style.transition = '';
        el.style.opacity = '';
        el.style.transform = '';
        el.style.display = '';
      }, 500);
    } else if (!el.classList.contains('hidden')) {
      // Animate old screen out
      el.style.transition = 'transform .35s var(--curve-smooth), opacity .35s ease';
      el.style.opacity = '0';
      el.style.transform = dir === 'back' ? 'translateX(30%)' : 'translateX(-30%)';
      setTimeout(function() {
        el.classList.add('hidden');
        el.style.transition = '';
        el.style.opacity = '';
        el.style.transform = '';
        el.style.display = '';
      }, 400);
    }
  });
}

// ===== Preload puzzle images =====
function preloadPuzzleImages() {
  IMAGES.slice(0, 6).forEach(function(img) {
    var el = new Image();
    el.src = 'images/' + img.file;
  });
}
preloadPuzzleImages();

// ===== Init =====
initCityGrid();
showSplash();
</script>
